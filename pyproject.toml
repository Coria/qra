[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qra-agent"
version = "0.1.0"
description = "LangGraph agent for quantitative strategy backtest report review"
readme = "README.md"
keywords = ["quant", "backtest", "review", "langgraph", "mcp"]
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "beautifulsoup4>=4.12.0",
  "fastmcp>=2.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
quant = [
  "quantstats>=0.0.6",
  "vectorbt>=0.26.0",
]

[project.scripts]
qra = "qra_agent.cli:main"
qra-agent = "qra_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
